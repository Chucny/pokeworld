<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pokeworld AR</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Video feed matched precisely to viewport dimensions */
    #webcam {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: translate(-50%, -50%);
      z-index: 0;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Auth Overlay */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      background: rgba(5, 5, 8, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #login-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0 0 4px 0;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .tab-group {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    #auth-status {
      font-size: 12px;
      margin-top: 12px;
      min-height: 16px;
      color: #f87171;
    }

    /* HUD Bar */
    #game-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-space: space-between;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #game-hud.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .hud-pill {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-btn-exit {
      background: rgba(239, 68, 68, 0.3);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      transition: background 0.3s ease;
    }
    .sync-indicator.syncing {
      background: #fbbf24;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
  </script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <div id="login-overlay">
    <div class="login-card">
      <h1 class="brand-title">POKEWORLD</h1>
      <p class="brand-subtitle">Login to access AR</p>

      <div class="tab-group">
        <button class="tab-btn active" id="tab-login">Login</button>
        <button class="tab-btn" id="tab-signup">Create Account</button>
      </div>

      <input type="text" id="username" class="input-field" placeholder="Username" autocomplete="off">
      <input type="password" id="password" class="input-field" placeholder="Password">

      <button id="action-btn" class="submit-btn">Enter Game</button>
      <div id="auth-status"></div>
    </div>
  </div>

  <div id="game-hud">
    <div class="hud-pill">
      <span class="sync-indicator" id="sync-dot"></span>
      <span id="user-display">Trainer</span>
      <span style="opacity: 0.4;">|</span>
      <span>Caught: <strong id="caught-count" style="color: #38bdf8;">0</strong></span>
    </div>
    <button class="hud-btn-exit" id="exit-btn">Exit</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics.js";
    import { getDatabase, ref, get, child, set, update, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    // ==========================================
    // 1. FIREBASE CONFIG & API FUNCTIONS [cite: 1, 2, 4, 5]
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCcucgyr9Y8I7IIB7a-N5HjPXD7XDHiPLw",
      authDomain: "pokeworld-game.firebaseapp.com",
      databaseURL: "https://pokeworld-game-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pokeworld-game",
      storageBucket: "pokeworld-game.firebasestorage.app",
      messagingSenderId: "543475382309",
      appId: "1:543475382309:web:cdc049bd105202e3cd67cc",
      measurementId: "G-0R7TZPLYGG"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    let currentUser = null;
    let currentPass = null;
    let inventory = [];
    let syncIntervalId = null;

    async function create_account(username, password) {
      if (!username || !password) throw new Error("Please fill in all fields.");
      const snapshot = await get(child(ref(db), `users/${username}`));
      if (snapshot.exists()) throw new Error("Username already taken.");
      await set(ref(db, `users/${username}`), {
        password: password,
        inventory: JSON.stringify([])
      });
    }

    async function load_inventory(username, password) {
      const snapshot = await get(child(ref(db), `users/${username}`));
      if (!snapshot.exists()) throw new Error("Account does not exist.");
      const data = snapshot.val();
      if (data.password !== password) throw new Error("Incorrect password.");
      return data.inventory || "[]";
    }

    async function update_inventory(username, password, current_inventory) {
      const syncDot = document.getElementById('sync-dot');
      if (syncDot) syncDot.classList.add('syncing');
      await update(ref(db, `users/${username}`), {
        inventory: JSON.stringify(current_inventory)
      });
      if (syncDot) setTimeout(() => syncDot.classList.remove('syncing'), 500);
    }

    async function delete_account(username, password) {
      await load_inventory(username, password);
      await remove(ref(db, `users/${username}`));
    }

    window.create_account = create_account;
    window.load_inventory = load_inventory;
    window.update_inventory = update_inventory;
    window.delete_account = delete_account;

    // ==========================================
    // 2. THREE.JS SCENE & DYNAMIC OPTICAL CALIBRATION
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 500);
    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(3, 10, 4);
    scene.add(dirLight);

    const gltfLoader = new GLTFLoader();

    // Scale glb max dimension to exactly 1.0 meter [cite: 6]
    function loadNormalizedGLTF(url, callback, fallbackUrl = '8.glb') {
      gltfLoader.load(
        url,
        (gltf) => {
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          box.getSize(size);

          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0) {
            const scaleFactor = 1.0 / maxDim; // Exactly 1m scaling magic number [cite: 6]
            model.scale.set(scaleFactor, scaleFactor, scaleFactor);
          }
          callback(model);
        },
        undefined,
        (err) => {
          console.warn(`Could not load ${url}. Fallback to ${fallbackUrl}`);
          if (url !== fallbackUrl) loadNormalizedGLTF(fallbackUrl, callback, fallbackUrl);
        }
      );
    }

    // ==========================================
    // 3. WEBCAM STREAM & OPTICAL FOV MATCHING
    // ==========================================
    let videoElement = document.getElementById('webcam');

    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoElement.srcObject = stream;

        videoElement.onloadedmetadata = () => {
          videoElement.play();
          calibrateCameraProjection();
        };
      } catch (e) {
        console.warn("Camera stream unavailable.", e);
      }
    }

    function calibrateCameraProjection() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const screenAspect = windowWidth / windowHeight;

      let vWidth = videoElement.videoWidth || 1280;
      let vHeight = videoElement.videoHeight || 720;
      let videoAspect = vWidth / vHeight;

      // Adjust camera FOV so digital camera projection matches physical lens crop ratio
      let defaultFov = 60; // Average smartphone rear lens FOV
      if (screenAspect < videoAspect) {
        // Horizontal crop: Adjust FOV to maintain 1:1 scale with video
        let fovRad = 2 * Math.atan(Math.tan((defaultFov * Math.PI / 180) / 2) * (videoAspect / screenAspect));
        camera.fov = fovRad * (180 / Math.PI);
      } else {
        camera.fov = defaultFov;
      }

      camera.aspect = screenAspect;
      camera.updateProjectionMatrix();
      renderer.setSize(windowWidth, windowHeight);
    }

    // ==========================================
    // 4. PRECISE GYROSCOPE & SENSOR TRANSFORM
    // ==========================================
    function requestDevicePermissions() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(res => { if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation); })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(res => { if (res === 'granted') window.addEventListener('devicemotion', handleMotion); })
          .catch(console.error);
      } else {
        window.addEventListener('devicemotion', handleMotion);
      }
    }

    const euler = new THREE.Euler();
    const deviceQuaternion = new THREE.Quaternion();
    const screenTransform = new THREE.Quaternion();
    const worldTransform = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90 deg X axis shift

    function handleOrientation(event) {
      if (event.alpha === null || event.beta === null) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
      const beta = THREE.MathUtils.degToRad(event.beta || 0);
      const gamma = THREE.MathUtils.degToRad(event.gamma || 0);
      const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

      euler.set(beta, alpha, -gamma, 'YXZ');
      deviceQuaternion.setFromEuler(euler);
      screenTransform.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);

      // Multiply transforms to align browser camera with world reference frame
      camera.quaternion.copy(deviceQuaternion);
      camera.quaternion.multiply(worldTransform);
      camera.quaternion.multiply(screenTransform);
    }

    // ==========================================
    // 5. WALKING DETECTOR & GROUND SPAWNING 
    // ==========================================
    let activePokemon = null;
    let pokeballs = [];
    const gravity = 9.81; // Gravity for pokeballs [cite: 9]

    let lastSpawnTime = 0;
    let lastAccMag = 0;

    function handleMotion(evt) {
      if (!currentUser) return;
      const acc = evt.acceleration || evt.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;

      const currentMag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      const deltaMag = Math.abs(currentMag - lastAccMag);
      lastAccMag = currentMag;

      const now = Date.now();

      // Detect walking steps with 5-second cooldown 
      if (deltaMag > 3.0 && (now - lastSpawnTime > 5000)) {
        lastSpawnTime = now;
        triggerRandomSpawn();
      }
    }

    function triggerRandomSpawn() {
      const randomData = [
        8, // Model 8.glb [cite: 3]
        Math.floor(Math.random() * 50) + 1,
        Math.floor(Math.random() * 50) + 1,
        Math.floor(Math.random() * 50) + 1
      ];
      spawn_pokemon(randomData);
    }

    function spawn_pokemon(data, position) {
      const modelPath = data[0] + ".glb";

      loadNormalizedGLTF(modelPath, (model) => {
        if (activePokemon) scene.remove(activePokemon.mesh);

        let targetPos = new THREE.Vector3();
        if (position) {
          targetPos.copy(position);
        } else {
          // Calculate forward horizontal vector on ground plane
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
          forward.y = 0; // Lock to ground plane horizontal vector
          if (forward.lengthSq() < 0.001) forward.set(0, 0, -1);
          forward.normalize();

          // Spawn 2.2m ahead, exactly 1.4m below camera height 
          targetPos.copy(camera.position);
          targetPos.addScaledVector(forward, 2.2);
          targetPos.y -= 1.4; // 1.4m below camera 
        }

        model.position.copy(targetPos);
        // Face the player
        model.lookAt(camera.position.x, model.position.y, camera.position.z);
        scene.add(model);

        activePokemon = {
          mesh: model,
          data: data,
          isCatching: false
        };
      });
    }

    // ==========================================
    // 6. POKEBALL THROWING & CATCH MECHANICS [cite: 2, 6, 9]
    // ==========================================
    function throw_pokeball(forwardVel, upwardVel, rightVel) {
      loadNormalizedGLTF('ball.glb', (ballMesh) => { // Uses ball.glb 
        // Offset launch position to simulate hand origin
        const handOffset = new THREE.Vector3(0.15, -0.25, -0.4);
        handOffset.applyQuaternion(camera.quaternion);
        
        const startPos = new THREE.Vector3().copy(camera.position).add(handOffset);
        ballMesh.position.copy(startPos);
        scene.add(ballMesh);

        // Convert camera launch vectors into world-space velocity
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const up = new THREE.Vector3(0, 1, 0);

        const velocity = new THREE.Vector3()
          .addScaledVector(forward, forwardVel)
          .addScaledVector(right, rightVel)
          .addScaledVector(up, upwardVel);

        pokeballs.push({
          mesh: ballMesh,
          velocity: velocity,
          active: true,
          createdTime: clock.getElapsedTime()
        });
      });
    }

    function catch_pokemon(pokemonObj, data) {
      if (!pokemonObj || pokemonObj.isCatching) return;
      pokemonObj.isCatching = true;

      const pokemonMesh = pokemonObj.mesh;
      const targetBall = pokeballs[pokeballs.length - 1]?.mesh;
      let startTime = clock.getElapsedTime();

      // Step 1: Vacuum shrink phase [cite: 2]
      const vacuumInterval = setInterval(() => {
        const elapsed = clock.getElapsedTime() - startTime;
        if (elapsed < 0.8) {
          pokemonMesh.scale.multiplyScalar(0.85);
          if (targetBall) pokemonMesh.position.lerp(targetBall.position, 0.25);
        } else {
          clearInterval(vacuumInterval);
          scene.remove(pokemonMesh);

          // Step 2: 3 shakes [cite: 2]
          if (targetBall) {
            let shakeCount = 0;
            const shakeInterval = setInterval(() => {
              targetBall.rotation.z += (shakeCount % 2 === 0 ? 0.3 : -0.3);
              shakeCount++;
              if (shakeCount >= 6) { // 3 full back-and-forth shakes [cite: 2]
                clearInterval(shakeInterval);
                targetBall.rotation.z = 0;

                // Step 3: Star burst & inventory add [cite: 2]
                createStarBurst(targetBall.position);
                inventory.push(data);
                document.getElementById('caught-count').innerText = inventory.length;

                setTimeout(() => {
                  scene.remove(targetBall);
                  activePokemon = null;
                }, 1000);
              }
            }, 300);
          }
        }
      }, 30);
    }

    function createStarBurst(pos) {
      const pCount = 35;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      for (let i = 0; i < pCount; i++) positions.push(pos.x, pos.y, pos.z);
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.08 });
      const pSystem = new THREE.Points(geometry, material);
      scene.add(pSystem);

      let frame = 0;
      const anim = setInterval(() => {
        frame++;
        const posAttr = pSystem.geometry.attributes.position;
        for (let i = 0; i < pCount; i++) {
          posAttr.setXYZ(
            i,
            posAttr.getX(i) + (Math.random() - 0.5) * 0.08,
            posAttr.getY(i) + (Math.random() - 0.5) * 0.08,
            posAttr.getZ(i) + (Math.random() - 0.5) * 0.08
          );
        }
        posAttr.needsUpdate = true;
        if (frame > 20) {
          clearInterval(anim);
          scene.remove(pSystem);
        }
      }, 30);
    }

    // Touch gesture swipe throw listener [cite: 6]
    let touchStartY = 0;
    let touchStartX = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
    });

    window.addEventListener('touchend', (e) => {
      if (!currentUser) return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      const deltaX = e.changedTouches[0].clientX - touchStartX;

      if (deltaY > 35) { // Upward swipe [cite: 6]
        const forwardVel = Math.min(deltaY * 0.035, 11.0);
        const upwardVel = Math.min(deltaY * 0.018, 5.5);
        const rightVel = (deltaX / window.innerWidth) * 3.5;

        throw_pokeball(forwardVel, upwardVel, rightVel); // [cite: 2]
      }
    });

    window.spawn_pokemon = spawn_pokemon;
    window.throw_pokeball = throw_pokeball;
    window.catch_pokemon = catch_pokemon;
    window.triggerRandomSpawn = triggerRandomSpawn;

    // ==========================================
    // 7. MAIN ANIMATION LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      for (let i = pokeballs.length - 1; i >= 0; i--) {
        const ball = pokeballs[i];
        if (!ball.active) continue;

        // Apply gravity trajectory [cite: 9]
        ball.velocity.y -= gravity * dt;
        ball.mesh.position.addScaledVector(ball.velocity, dt);

        if (activePokemon && !activePokemon.isCatching) {
          const dist = ball.mesh.position.distanceTo(activePokemon.mesh.position);
          if (dist < 0.9) {
            ball.active = false;
            catch_pokemon(activePokemon, activePokemon.data); // [cite: 2]
          }
        }

        if (clock.getElapsedTime() - ball.createdTime > 3.5) {
          scene.remove(ball.mesh);
          pokeballs.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', calibrateCameraProjection);

    // ==========================================
    // 8. AUTHENTICATION & DATABASE SYNC [cite: 1, 9]
    // ==========================================
    let authMode = 'login';

    function switchMode(mode) {
      authMode = mode;
      document.getElementById('tab-login').className = 'tab-btn' + (mode === 'login' ? ' active' : '');
      document.getElementById('tab-signup').className = 'tab-btn' + (mode === 'signup' ? ' active' : '');
      document.getElementById('action-btn').innerText = mode === 'login' ? 'Enter Game' : 'Create Account';
      document.getElementById('auth-status').innerText = '';
    }

    async function handleSubmit() {
      requestDevicePermissions();
      await initWebcam();

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const statusEl = document.getElementById('auth-status');

      if (!u || !p) {
        statusEl.innerText = "Username and password required.";
        return;
      }

      statusEl.innerText = "Connecting...";

      try {
        if (authMode === 'signup') await create_account(u, p); // [cite: 2]
        
        const invStr = await load_inventory(u, p); // [cite: 1]
        inventory = JSON.parse(invStr);
        currentUser = u;
        currentPass = p;

        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('game-hud').classList.add('visible');
        document.getElementById('user-display').innerText = u;
        document.getElementById('caught-count').innerText = inventory.length;

        // Spawn initial Pokemon on entry
        setTimeout(() => triggerRandomSpawn(), 800);

        // Sync whole inventory to Firebase every 15 seconds [cite: 1, 9]
        syncIntervalId = setInterval(() => {
          if (currentUser && currentPass) {
            update_inventory(currentUser, currentPass, inventory); // [cite: 1, 9]
          }
        }, 15000);

      } catch (err) {
        statusEl.innerText = err.message;
      }
    }

    function handleLogout() {
      currentUser = null;
      currentPass = null;
      inventory = [];
      if (syncIntervalId) clearInterval(syncIntervalId);

      document.getElementById('game-hud').classList.remove('visible');
      document.getElementById('login-overlay').classList.remove('hidden');
      document.getElementById('auth-status').innerText = '';
      document.getElementById('password').value = '';
      
      if (activePokemon) {
        scene.remove(activePokemon.mesh);
        activePokemon = null;
      }
    }

    document.getElementById('tab-login').addEventListener('click', () => switchMode('login'));
    document.getElementById('tab-signup').addEventListener('click', () => switchMode('signup'));
    document.getElementById('action-btn').addEventListener('click', handleSubmit);
    document.getElementById('exit-btn').addEventListener('click', handleLogout);

  </script>
</body>
</html>
