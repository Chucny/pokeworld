<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pokeworld AR</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #050508;
      color: #ffffff;
      user-select: none;
    }

    /* AR Viewport & Camera Video */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Standard Login Modal Screen */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      background: rgba(5, 5, 8, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #login-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      text-align: center;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* Auth Tab Toggle */
    .tab-group {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    /* Inputs & Action Button */
    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: #38bdf8;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: transform 0.1s ease;
    }
    .submit-btn:active {
      transform: scale(0.98);
    }

    #auth-status {
      font-size: 12px;
      margin-top: 14px;
      min-height: 16px;
      color: #f87171;
    }

    /* Minimal In-Game Top HUD */
    #game-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #game-hud.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .hud-pill {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-btn {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }
  </style>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="canvas-container"></div>

  <div id="login-overlay">
    <div class="login-card">
      <h1 class="brand-title">POKEWORLD AR</h1>
      <p class="brand-subtitle">Login to access your trainer data</p>

      <div class="tab-group">
        <button class="tab-btn active" id="tab-login" onclick="window.switchMode('login')">Login</button>
        <button class="tab-btn" id="tab-signup" onclick="window.switchMode('signup')">Create Account</button>
      </div>

      <input type="text" id="username" class="input-field" placeholder="Username" autocomplete="off">
      <input type="password" id="password" class="input-field" placeholder="Password">

      <button id="action-btn" class="submit-btn" onclick="window.handleSubmit()">Enter Game</button>
      <div id="auth-status"></div>
    </div>
  </div>

  <div id="game-hud">
    <div class="hud-pill">
      <span class="sync-indicator"></span>
      <span id="user-display">Trainer</span>
      <span style="opacity: 0.4;">|</span>
      <span>Caught: <strong id="caught-count" style="color: #38bdf8;">0</strong></span>
    </div>
    <button class="hud-btn" onclick="window.handleLogout()">Exit Game</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, get, child, set, update, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
    import * as THREE from "https://unpkg.com/three@0.128.0/build/three.module.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js";

    // ==========================================
    // 1. FIREBASE INITIALIZATION & CORE API
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCcucgyr9Y8I7IIB7a-N5HjPXD7XDHiPLw",
      authDomain: "pokeworld-game.firebaseapp.com",
      databaseURL: "https://pokeworld-game-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pokeworld-game",
      storageBucket: "pokeworld-game.firebasestorage.app",
      messagingSenderId: "543475382309",
      appId: "1:543475382309:web:cdc049bd105202e3cd67cc",
      measurementId: "G-0R7TZPLYGG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let currentPass = null;
    let inventory = [];

    async function create_account(username, password) {
      if (!username || !password) throw new Error("Please fill in all fields.");
      const dbRef = ref(db);
      const snapshot = await get(child(dbRef, `users/${username}`));
      if (snapshot.exists()) {
        throw new Error("Username already taken.");
      }
      await set(ref(db, `users/${username}`), {
        password: password,
        inventory: JSON.stringify([])
      });
    }

    async function load_inventory(username, password) {
      const dbRef = ref(db);
      const snapshot = await get(child(dbRef, `users/${username}`));
      if (!snapshot.exists()) throw new Error("Account does not exist.");
      const data = snapshot.val();
      if (data.password !== password) throw new Error("Incorrect password.");
      return data.inventory || "[]";
    }

    async function update_inventory(username, password, current_inventory) {
      await update(ref(db, `users/${username}`), {
        inventory: JSON.stringify(current_inventory)
      });
    }

    async function delete_account(username, password) {
      await load_inventory(username, password);
      await remove(ref(db, `users/${username}`));
    }

    window.create_account = create_account;
    window.load_inventory = load_inventory;
    window.update_inventory = update_inventory;
    window.delete_account = delete_account;


    // ==========================================
    // 2. AUTH SCREEN & UI CONTROLS
    // ==========================================
    let authMode = 'login';

    function switchMode(mode) {
      authMode = mode;
      document.getElementById('tab-login').className = 'tab-btn' + (mode === 'login' ? ' active' : '');
      document.getElementById('tab-signup').className = 'tab-btn' + (mode === 'signup' ? ' active' : '');
      document.getElementById('action-btn').innerText = mode === 'login' ? 'Enter Game' : 'Create Account';
      document.getElementById('auth-status').innerText = '';
    }

    async function handleSubmit() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const statusEl = document.getElementById('auth-status');

      if (!u || !p) {
        statusEl.innerText = "Username and password required.";
        return;
      }

      statusEl.innerText = "Connecting...";

      try {
        if (authMode === 'signup') {
          await create_account(u, p);
        }
        await loadAndEnterGame(u, p);
      } catch (err) {
        statusEl.innerText = err.message;
      }
    }

    async function loadAndEnterGame(u, p) {
      try {
        const invStr = await load_inventory(u, p);
        inventory = JSON.parse(invStr);
        currentUser = u;
        currentPass = p;

        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('game-hud').classList.add('visible');
        document.getElementById('user-display').innerText = u;
        updateCaughtCounter();

        requestGyroPermissions();
      } catch (err) {
        document.getElementById('auth-status').innerText = err.message;
      }
    }

    function handleLogout() {
      currentUser = null;
      currentPass = null;
      inventory = [];

      document.getElementById('game-hud').classList.remove('visible');
      document.getElementById('login-overlay').classList.remove('hidden');
      document.getElementById('auth-status').innerText = '';
      document.getElementById('password').value = '';
    }

    function updateCaughtCounter() {
      document.getElementById('caught-count').innerText = inventory.length;
    }

    window.switchMode = switchMode;
    window.handleSubmit = handleSubmit;
    window.handleLogout = handleLogout;

    setInterval(() => {
      if (currentUser && currentPass) {
        update_inventory(currentUser, currentPass, inventory)
          .catch(err => console.warn("Auto-sync error:", err));
      }
    }, 15000);


    // ==========================================
    // 3. WEBCAM STREAM SETUP
    // ==========================================
    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        document.getElementById('webcam').srcObject = stream;
      } catch (e) {
        console.warn("Camera streaming unavailable or denied.", e);
      }
    }
    initWebcam();


    // ==========================================
    // 4. THREE.JS & FULL LIGHTING FIXES
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    // LIGHTING FIX #1: Enable sRGB encoding & Filmic tone mapping so models aren't black
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    // LIGHTING FIX #2: All-around high-intensity lighting setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 1.8);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    const gltfLoader = new GLTFLoader();

    function loadNormalizedGLTF(url, callback) {
      gltfLoader.load(
        url,
        (gltf) => {
          const model = gltf.scene;

          // LIGHTING FIX #3: Traverse meshes & fix materials so textures pop nicely
          model.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.needsUpdate = true;
              if (child.material.metalness !== undefined) {
                child.material.metalness = 0.1; // Reduce metallic pitch-black reflection
              }
              if (child.material.roughness !== undefined) {
                child.material.roughness = 0.6;
              }
            }
          });

          // Normalize model size to exactly 1.0 meter
          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          box.getSize(size);

          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0) {
            const scaleFactor = 1.0 / maxDim;
            model.scale.set(scaleFactor, scaleFactor, scaleFactor);
          }

          callback(model);
        },
        undefined,
        (err) => console.error("Could not load GLB model:", url)
      );
    }


    // ==========================================
    // 5. GYROSCOPE CAMERA TRACKING (Fixes "Glued to Screen")
    // ==========================================
    let gyroEnabled = false;

    function requestGyroPermissions() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              gyroEnabled = true;
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        gyroEnabled = true;
      }
    }

    const deviceEuler = new THREE.Euler();
    const finalQuaternion = new THREE.Quaternion();

    function handleOrientation(event) {
      if (!event.alpha && !event.beta) return;

      const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
      const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
      const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

      // Orient Three.js camera quaternion according to device motion
      deviceEuler.set(beta, gamma, -alpha, 'YXZ');
      camera.quaternion.setFromEuler(deviceEuler);
    }


    // ==========================================
    // 6. GAMEPLAY & AR FUNCTIONS
    // ==========================================
    let activePokemon = null;
    let pokeballs = [];
    const gravity = 9.81;

    function spawn_pokemon(data, position) {
      const pokedexId = data[0];
      const modelPath = pokedexId + ".glb";

      loadNormalizedGLTF(modelPath, (model) => {
        if (activePokemon) scene.remove(activePokemon.mesh);

        let targetPos = new THREE.Vector3();
        if (position) {
          targetPos.copy(position);
        } else {
          // Place 2.5 meters forward in current facing direction
          const forward = new THREE.Vector3(0, 0, -2.5).applyQuaternion(camera.quaternion);
          targetPos.copy(camera.position).add(forward);
          targetPos.y = camera.position.y - 0.8;
        }

        model.position.copy(targetPos);
        scene.add(model);

        activePokemon = {
          mesh: model,
          data: data,
          isCatching: false
        };
      });
    }

    function throw_pokeball(direction) {
      loadNormalizedGLTF('ball.glb', (ballMesh) => {
        ballMesh.position.copy(camera.position);
        scene.add(ballMesh);

        const velocity = direction.clone().multiplyScalar(8.0);
        velocity.y += 2.5;

        pokeballs.push({
          mesh: ballMesh,
          velocity: velocity,
          active: true,
          createdTime: clock.getElapsedTime()
        });
      });
    }

    function catch_pokemon(pokemonObj, data) {
      if (!pokemonObj || pokemonObj.isCatching) return;
      pokemonObj.isCatching = true;

      const pokemonMesh = pokemonObj.mesh;
      const targetBall = pokeballs[pokeballs.length - 1]?.mesh;
      let startTime = clock.getElapsedTime();

      // Phase 1: Vacuum / Shrink inside ball
      const vacuumInterval = setInterval(() => {
        const elapsed = clock.getElapsedTime() - startTime;
        if (elapsed < 0.8) {
          pokemonMesh.scale.multiplyScalar(0.85);
          if (targetBall) pokemonMesh.position.lerp(targetBall.position, 0.2);
        } else {
          clearInterval(vacuumInterval);
          scene.remove(pokemonMesh);

          // Phase 2: Ball Shake 3 times
          if (targetBall) {
            let shakeCount = 0;
            const shakeInterval = setInterval(() => {
              targetBall.rotation.z += (shakeCount % 2 === 0 ? 0.3 : -0.3);
              shakeCount++;
              if (shakeCount >= 6) {
                clearInterval(shakeInterval);
                targetBall.rotation.z = 0;

                // Phase 3: Stars Burst
                createStarBurst(targetBall.position);

                // Phase 4: Push to inventory & sync
                inventory.push(data);
                updateCaughtCounter();
                if (currentUser && currentPass) {
                  update_inventory(currentUser, currentPass, inventory);
                }

                setTimeout(() => {
                  scene.remove(targetBall);
                  activePokemon = null;
                }, 1000);
              }
            }, 300);
          }
        }
      }, 30);
    }

    function createStarBurst(pos) {
      const pCount = 30;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      for (let i = 0; i < pCount; i++) {
        positions.push(pos.x, pos.y, pos.z);
      }
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ color: 0xffd700, size: 0.1 });
      const pSystem = new THREE.Points(geometry, material);
      scene.add(pSystem);

      let frame = 0;
      const anim = setInterval(() => {
        frame++;
        const posAttr = pSystem.geometry.attributes.position;
        for (let i = 0; i < pCount; i++) {
          posAttr.setXYZ(
            i,
            posAttr.getX(i) + (Math.random() - 0.5) * 0.1,
            posAttr.getY(i) + (Math.random() - 0.5) * 0.1,
            posAttr.getZ(i) + (Math.random() - 0.5) * 0.1
          );
        }
        posAttr.needsUpdate = true;
        if (frame > 20) {
          clearInterval(anim);
          scene.remove(pSystem);
        }
      }, 30);
    }

    window.spawn_pokemon = spawn_pokemon;
    window.throw_pokeball = throw_pokeball;
    window.catch_pokemon = catch_pokemon;


    // ==========================================
    // 7. MOTION WALKING SPAWN DETECTOR
    // ==========================================
    let lastSpawnTime = 0;

    window.addEventListener('devicemotion', (evt) => {
      if (!currentUser) return;

      const acc = evt.accelerationIncludingGravity;
      if (!acc) return;

      const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      const now = Date.now();

      if (mag > 12.5 && (now - lastSpawnTime > 5000)) {
        lastSpawnTime = now;
        const randomPokedexId = Math.floor(Math.random() * 150) + 1;
        const randomData = [
          randomPokedexId,
          Math.floor(Math.random() * 50) + 1,
          Math.floor(Math.random() * 50) + 1,
          Math.floor(Math.random() * 50) + 1
        ];
        spawn_pokemon(randomData);
      }
    });


    // ==========================================
    // 8. SWIPE TO THROW POKEBALL
    // ==========================================
    let touchStartY = 0;
    let touchStartX = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
    });

    window.addEventListener('touchend', (e) => {
      if (!currentUser) return;

      const deltaY = touchStartY - e.changedTouches[0].clientY;
      const deltaX = e.changedTouches[0].clientX - touchStartX;

      if (deltaY > 80) {
        const dir = new THREE.Vector3(
          (deltaX / window.innerWidth) * 0.8,
          (deltaY / window.innerHeight) * 1.2,
          -1
        ).unproject(camera).sub(camera.position).normalize();

        throw_pokeball(dir);
      }
    });


    // ==========================================
    // 9. THREE.JS RENDER LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      for (let i = pokeballs.length - 1; i >= 0; i--) {
        const ball = pokeballs[i];
        if (!ball.active) continue;

        ball.velocity.y -= gravity * dt;
        ball.mesh.position.addScaledVector(ball.velocity, dt);

        if (activePokemon && !activePokemon.isCatching) {
          const dist = ball.mesh.position.distanceTo(activePokemon.mesh.position);
          if (dist < 0.8) {
            ball.active = false;
            catch_pokemon(activePokemon, activePokemon.data);
          }
        }

        if (clock.getElapsedTime() - ball.createdTime > 4.0) {
          scene.remove(ball.mesh);
          pokeballs.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
