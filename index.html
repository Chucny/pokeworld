<!DOCTYPE html>
<html lang="en">
<head>

  <title>Pokeworld - Dev Environment</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111827; /* Dark background instead of transparent */
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 3D WebGL Canvas Layer */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Login & Account Overlay */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      background: rgba(8, 10, 16, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #login-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0 0 4px 0;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .tab-group {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    #auth-status {
      font-size: 12px;
      margin-top: 12px;
      min-height: 16px;
      color: #f87171;
    }

    /* Game HUD Overlay */
    #game-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between; /* Fixed typo */
      align-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #game-hud.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .hud-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn-exit {
      background: rgba(239, 68, 68, 0.3);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      transition: background 0.3s ease;
    }
    .sync-indicator.syncing {
      background: #fbbf24;
    }

    async function create_account(username, password) {
      if (!username || !password) throw new Error("Please enter username & password.");
      const snapshot = await get(child(ref(db), `users/${username}`));
      if (snapshot.exists()) throw new Error("Username is already taken.");
      await set(ref(db, `users/${username}`), { password: password, inventory: JSON.stringify([]) });
    }

    async function load_inventory(username, password) {
      const snapshot = await get(child(ref(db), `users/${username}`));
      if (!snapshot.exists()) throw new Error("Account not found.");
      const data = snapshot.val();
      if (data.password !== password) throw new Error("Incorrect password.");
      return data.inventory || "[]";
    }

    async function update_inventory(username, password, current_inventory) {
      const syncDot = document.getElementById('sync-dot');
      if (syncDot) syncDot.classList.add('syncing');
      await update(ref(db, `users/${username}`), { inventory: JSON.stringify(current_inventory) });
      if (syncDot) setTimeout(() => syncDot.classList.remove('syncing'), 500);
    }

    // =========================================================================
    // SECTION 2: THREE.JS 3D SCENE SETUP
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827); // Solid color instead of AR

    // Perspective Camera
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 500);
    camera.position.set(0, 0, 0);

    // Add a Grid so you can see your rotation working later
    const gridHelper = new THREE.GridHelper(50, 50, 0x38bdf8, 0x444444);
    gridHelper.position.y = -1.5;
    scene.add(gridHelper);

    // WebGL Renderer
    // Remove or comment out this line:
// scene.background = new THREE.Color(0x111827); 

// Update your renderer to be transparent:
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // Scene Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(3, 10, 4);
    scene.add(dirLight);

    const gltfLoader = new GLTFLoader();

    function loadNormalizedGLTF(url, callback, fallbackUrl = '8.glb') {
      gltfLoader.load(
        url,
        (gltf) => {
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0) {
            const scaleFactor = 1.0 / maxDim;
            model.scale.set(scaleFactor, scaleFactor, scaleFactor);
          }
          callback(model);
        },
        undefined,
        () => { if (url !== fallbackUrl) loadNormalizedGLTF(fallbackUrl, callback, fallbackUrl); }
      );
    }

    // SPAWNING

// Global variable to store active Pokémon data
function spawn_pokemon() {
  // If a Pokémon is already active, don't spawn another one
  if (activePokemon) return;

  // Pick a random ID/Model (e.g., '1.glb', '2.glb', etc., fallback to '8.glb')
  const randomPikaId = Math.floor(Math.random() * 149) + 1;
  const modelUrl = `${randomPikaId}.glb`;

  loadNormalizedGLTF(modelUrl, (mesh) => {
    // 1. Calculate random distance (1m to 5m)
    const distance = 1 + Math.random() * 4; 

    // 2. Calculate random angle around the user (0 to 360 degrees)
    const angle = Math.random() * Math.PI * 2;

    // 3. Position relative to camera/user
    const x = Math.sin(angle) * distance;
    const z = -Math.cos(angle) * distance; 
    const y = -0.5; // Place slightly below camera level

    mesh.position.set(camera.position.x + x, y, camera.position.z + z);

    // 4. Set a random Y-axis rotation (facing direction)
    mesh.rotation.y = Math.random() * Math.PI * 2;

    scene.add(mesh);

    // Set active Pokémon object for collision detection
    activePokemon = {
      mesh: mesh,
      isCatching: false,
      data: { id: randomPikaId, caughtAt: new Date().toISOString() }
    };
  });
}

let stepCount = 0;
let lastSpawnTime = 0;
let lastAccelMagnitude = 0;
const COOLDOWN_MS = 5000;      // 5-second spawn cooldown
const STEPS_TO_SPAWN = 4;      // ~4 steps (~3 meters of walking)
const ACCEL_THRESHOLD = 11.8;  // Acceleration magnitude threshold to trigger 1 step

function handleMotion(event) {
  const accel = event.accelerationIncludingGravity || event.acceleration;
  if (!accel || accel.x === null) return;

  // Calculate total acceleration magnitude
  const mag = Math.sqrt(accel.x * accel.x + accel.y * accel.y + accel.z * accel.z);

  // Peak detection: Detect when motion passes threshold going upward
  if (mag > ACCEL_THRESHOLD && lastAccelMagnitude <= ACCEL_THRESHOLD) {
    stepCount++;
    const now = Date.now();

    // Check if user walked enough steps AND cooldown has passed
    if (stepCount >= STEPS_TO_SPAWN && (now - lastSpawnTime >= COOLDOWN_MS)) {
      lastSpawnTime = now;
      stepCount = 0; // Reset step counter for next spawn
      spawn_pokemon();
    }
  }

  lastAccelMagnitude = mag;
}

async function initStepTracker() {
  // iOS 13+ requires explicit motion permission
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const permission = await DeviceMotionEvent.requestPermission();
      if (permission === 'granted') {
        window.addEventListener('devicemotion', handleMotion, true);
      }
    } catch (err) {
      console.warn("Motion permission rejected:", err);
    }
  } else {
    // Android / standard Web
    window.addEventListener('devicemotion', handleMotion, true);
  }
}

const videoElement = document.getElementById('webcam');

// 3. - 1 Initialize the background camera feed
async function initWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    videoElement.srcObject = stream;
    videoElement.play();
  } catch (err) {
    console.warn("Camera access denied or unavailable.", err);
  }
}

// 3. - 2 Quaternion Math for 3DOF Tracking
const euler = new THREE.Euler();
const deviceQuaternion = new THREE.Quaternion();
const screenTransform = new THREE.Quaternion();
// This specific transform aligns the phone's IMU coordinate system with Three.js's coordinate system
const worldTransform = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 

function handleOrientation(event) {
  if (event.alpha === null || event.beta === null) return;

  // Convert raw degrees to radians
  const alpha = THREE.MathUtils.degToRad(event.alpha); // Z-axis (Compass)
  const beta  = THREE.MathUtils.degToRad(event.beta);  // X-axis (Pitch)
  const gamma = THREE.MathUtils.degToRad(event.gamma); // Y-axis (Roll)
  
  // Account for the screen orientation (portrait vs landscape)
  const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

  // Mobile devices apply rotations in YXZ order
  euler.set(beta, alpha, -gamma, 'YXZ');
  deviceQuaternion.setFromEuler(euler);
  screenTransform.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient);

  // Apply the calculated rotation to the Three.js camera
  camera.quaternion.copy(deviceQuaternion);
  camera.quaternion.multiply(worldTransform);
  camera.quaternion.multiply(screenTransform);
}

// 3. - 3 Request Permissions and Start Sensors
async function initSensors() {
  console.log("Initializing 3DOF Sensors and AR Camera...");
  
  await initWebcam();

  // iOS 13+ requires explicit permission for device orientation
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
      } else {
        alert("Gyroscope permission denied. The 3D world will not track your movement.");
      }
    } catch (err) {
      console.error("Error requesting device orientation permission:", err);
    }
  } else {
    // Android / Older iOS
    window.addEventListener('deviceorientation', handleOrientation, true);
  }
}

    // =========================================================================
    // SECTION 4: POKÉBALL PHYSICS & VACUUM CATCH
    // =========================================================================
    let activePokemon = null;
    let pokeballs = [];
    const gravity = 9.81;

    function throw_pokeball(forwardVel, upwardVel, rightVel) {
      loadNormalizedGLTF('ball.glb', (ballMesh) => {
        const handOffset = new THREE.Vector3(0.15, -0.25, -0.4).applyQuaternion(camera.quaternion);
        const startPos = new THREE.Vector3().copy(camera.position).add(handOffset);
        ballMesh.position.copy(startPos);
        scene.add(ballMesh);

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const up = new THREE.Vector3(0, 1, 0);

        const velocity = new THREE.Vector3()
          .addScaledVector(forward, forwardVel)
          .addScaledVector(right, rightVel)
          .addScaledVector(up, upwardVel);

        pokeballs.push({ mesh: ballMesh, velocity: velocity, active: true, createdTime: clock.getElapsedTime() });
      });
    }

    function catch_pokemon(pokemonObj, data) {
      if (!pokemonObj || pokemonObj.isCatching) return;
      pokemonObj.isCatching = true;
      const pokemonMesh = pokemonObj.mesh;
      const targetBall = pokeballs[pokeballs.length - 1]?.mesh;
      let startTime = clock.getElapsedTime();

      const vacuumInterval = setInterval(() => {
        const elapsed = clock.getElapsedTime() - startTime;
        if (elapsed < 0.8) {
          pokemonMesh.scale.multiplyScalar(0.85);
          if (targetBall) pokemonMesh.position.lerp(targetBall.position, 0.25);
        } else {
          clearInterval(vacuumInterval);
          scene.remove(pokemonMesh);

          if (targetBall) {
            let shakeCount = 0;
            const shakeInterval = setInterval(() => {
              targetBall.rotation.z += (shakeCount % 2 === 0 ? 0.3 : -0.3);
              shakeCount++;
              if (shakeCount >= 6) {
                clearInterval(shakeInterval);
                targetBall.rotation.z = 0;
                createStarBurst(targetBall.position);
                inventory.push(data);
                document.getElementById('caught-count').innerText = inventory.length;
                setTimeout(() => { scene.remove(targetBall); activePokemon = null; }, 1000);
              }
            }, 300);
          }
        }
      }, 30);
    }

    function createStarBurst(pos) {
      const pCount = 35;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      for (let i = 0; i < pCount; i++) positions.push(pos.x, pos.y, pos.z);
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.08 });
      const pSystem = new THREE.Points(geometry, material);
      scene.add(pSystem);
      let frame = 0;
      const anim = setInterval(() => {
        frame++;
        const posAttr = pSystem.geometry.attributes.position;
        for (let i = 0; i < pCount; i++) {
          posAttr.setXYZ(i, posAttr.getX(i) + (Math.random() - 0.5) * 0.08, posAttr.getY(i) + (Math.random() - 0.5) * 0.08, posAttr.getZ(i) + (Math.random() - 0.5) * 0.08);
        }
        posAttr.needsUpdate = true;
        if (frame > 20) { clearInterval(anim); scene.remove(pSystem); }
      }, 30);
    }

    let touchStartY = 0;
    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
    });
    window.addEventListener('touchend', (e) => {
      if (!currentUser) return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      if (deltaY > 35) {
        const forwardVel = Math.min(deltaY * 0.035, 11.0);
        const upwardVel = Math.min(deltaY * 0.018, 5.5);
        const rightVel = (deltaX / window.innerWidth) * 3.5;
        throw_pokeball(forwardVel, upwardVel, rightVel);
      }
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      for (let i = pokeballs.length - 1; i >= 0; i--) {
        const ball = pokeballs[i];
        if (!ball.active) continue;
        ball.velocity.y -= gravity * dt;
        ball.mesh.position.addScaledVector(ball.velocity, dt);

        if (activePokemon && !activePokemon.isCatching) {
          const dist = ball.mesh.position.distanceTo(activePokemon.mesh.position);
          if (dist < 0.9) {
            ball.active = false;
            catch_pokemon(activePokemon, activePokemon.data);
          }
        }
        if (clock.getElapsedTime() - ball.createdTime > 3.5) { scene.remove(ball.mesh); pokeballs.splice(i, 1); }
      }
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // SECTION 5: AUTH UI HANDLERS
    // =========================================================================
    let authMode = 'login';
    function switchMode(mode) {
      authMode = mode;
      document.getElementById('tab-login').className = 'tab-btn' + (mode === 'login' ? ' active' : '');
      document.getElementById('tab-signup').className = 'tab-btn' + (mode === 'signup' ? ' active' : '');
      document.getElementById('action-btn').innerText = mode === 'login' ? 'Start Game' : 'Create Account';
      document.getElementById('auth-status').innerText = '';
    }

    async function handleSubmit() {
      await initSensors(); // Re-injected as a promise-based starter
      await initStepTracker(); // <--- Add this line here
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const statusEl = document.getElementById('auth-status');
      if (!u || !p) { statusEl.innerText = "Please enter username and password."; return; }
      statusEl.innerText = "Connecting...";

      try {
        if (authMode === 'signup') await create_account(u, p);
        const invStr = await load_inventory(u, p);
        inventory = JSON.parse(invStr);
        currentUser = u; currentPass = p;

        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('game-hud').classList.add('visible');
        document.getElementById('user-display').innerText = u;
        document.getElementById('caught-count').innerText = inventory.length;

        // Manual spawn test
        setTimeout(() => spawn_pokemon([1, 0, 0, 0]), 800);

        syncIntervalId = setInterval(() => {
          if (currentUser && currentPass) update_inventory(currentUser, currentPass, inventory);
        }, 15000);
      } catch (err) { statusEl.innerText = err.message; }
    }

    function handleLogout() {
      currentUser = null; currentPass = null; inventory = [];
      if (syncIntervalId) clearInterval(syncIntervalId);
      document.getElementById('game-hud').classList.remove('visible');
      document.getElementById('login-overlay').classList.remove('hidden');
      document.getElementById('auth-status').innerText = '';
      if (activePokemon) { scene.remove(activePokemon.mesh); activePokemon = null; }
    }

    document.getElementById('tab-login').addEventListener('click', () => switchMode('login'));
    document.getElementById('tab-signup').addEventListener('click', () => switchMode('signup'));
    document.getElementById('action-btn').addEventListener('click', handleSubmit);
    document.getElementById('exit-btn').addEventListener('click', handleLogout);

  </script>
